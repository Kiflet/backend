# On every pull request and every push to main: the checks and unit tests,
# the integration tests against PostGIS, and staging (the production compose
# file and images, with the provider sandbox) tested end to end over HTTPS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its run; every commit on main runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Dockerfile's Go release: the two move together.
  GO_VERSION: "1.27"
  SQLC_VERSION: "1.30.0"

jobs:
  checks:
    name: Vet, unit tests and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # All of it, for the secret scan.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make vet
      - run: make test
      - name: golangci-lint, the JavaScript parsed, a secret scan of the history, and the API's specification linted
        run: make lint
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: internal/db and the modules' stores are sqlc's output for their queries
        run: |
          curl -fsSL "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" sqlc
          "$RUNNER_TEMP/sqlc" diff -f sqlc/sqlc.yaml
          # sqlc leaves the output of a queries file that has gone (or moved
          # to a module): there must be none.
          for f in internal/db/*.sql.go; do
            test -f "sqlc/queries/$(basename "$f" .go)" || { echo "$f: sqlc/queries/$(basename "$f" .go) is gone"; exit 1; }
          done
          for f in internal/modules/*/store/*.sql.go; do
            test -f "$(dirname "$f")/queries/$(basename "$f" .go)" || { echo "$f: its queries are gone"; exit 1; }
          done
      - name: The Go and TypeScript code and the public API's document generated from the API's specification are current
        run: |
          make api
          changed=$(git status --porcelain -- internal/platform/api api/typescript internal/web/static/openapi.json)
          if [ -n "$changed" ]; then
            echo "Run make api and commit what it changes:"
            echo "$changed"
            git diff -- internal/platform/api api/typescript internal/web/static/openapi.json | head -50
            exit 1
          fi
      # A breaking change to a public or driver operation fails; one to an
      # app operation needs the api-break label, which a push after adding
      # it picks up.
      - name: Breaking changes to the API's specification
        if: github.event_name == 'pull_request'
        env:
          API_BREAK: ${{ contains(github.event.pull_request.labels.*.name, 'api-break') }}
        run: make api-breaking BASE=origin/${{ github.base_ref }}
      - name: Known vulnerabilities, in the code and in Go itself
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Shell scripts
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 scripts/*.sh
      - name: The product's former name stays out
        run: |
          # Only the changelog may say what Kiflet used to be called. The
          # brackets keep this step from finding itself.
          if git grep -nIi 'meng[e]d' -- . ':!CHANGELOG.md'; then
            echo "Kiflet's former name is in the files above."
            exit 1
          fi

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.6-alpine
        env:
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics
        ports:
          - 5432:5432
        # Over TCP: on first start the image's set-up server answers on the
        # socket only.
        options: >-
          --health-cmd "pg_isready -U logistics -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Each run makes its own database on this server; the S3 tests start
      # their store with testcontainers.
      # With the unit tests: what both cover of each package, which fails
      # below its floor (tests/coverage-floor.txt).
      - run: make cover
        env:
          TEST_DATABASE_URL: postgres://logistics:logistics@localhost:5432/postgres?sslmode=disable
      - name: What they cover, in the run's summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### What the unit and integration tests cover"
            scripts/coverage-summary.sh coverage.out
          } >> "$GITHUB_STEP_SUMMARY"
      # The floors are raised from this profile: another Go release counts
      # statements differently, so a local one doesn't do.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.out
          retention-days: 30

  # The same tests with every worker on RabbitMQ (TEST_RABBITMQ), as
  # production runs with it: positions, live updates, texts, email and
  # webhooks through their queues, from a container the tests start.
  integration-rabbitmq:
    name: Integration tests on RabbitMQ
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.6-alpine
        env:
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistics -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test-integration
        env:
          TEST_DATABASE_URL: postgres://logistics:logistics@localhost:5432/postgres?sslmode=disable
          TEST_RABBITMQ: "1"

  e2e:
    name: Staging, end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install age, which encrypts the backups
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - run: make staging-up
      - run: make test-e2e
      - name: Staging's logs
        if: failure()
        run: docker compose -p kiflet-staging logs --no-color --timestamps
      - if: always()
        run: make staging-down
