# A backend for Kiflet/web's and Kiflet/mobile's tests: a published image of
# this repository, with the demo company and the provider sandbox, on
# localhost over plain HTTP.
#
#   docker compose -f deployments/clients/compose.yml up -d --wait
#
# The API and the pages answer at http://localhost:8080 (KIFLET_PORT), the
# sandbox's phones and checkouts at http://localhost:8091 (SANDBOX_PORT).
# The demo logins are in README.md ("Run it locally"): demo@kiflet.et and
# dispatch@kiflet.et with the password kiflet-demo, drivers 0912345601 to
# 0912345605 with the PIN 2580. Texts the app sends land on the sandbox's
# phones, where a test reads its codes (GET /api/phones/{number}).
#
# KIFLET_TAG picks the build: `main` (the default, the newest merge),
# `sha-<7 characters>` for one commit, or a release such as `v0.10.0`.
# Every run starts empty, so a test can change anything; `down -v` throws
# it away.
#
# Nothing here is a secret: every value works with this stack only.
name: kiflet-clients

x-backend: &backend
  image: ${KIFLET_BACKEND_IMAGE:-ghcr.io/kiflet/backend}:${KIFLET_TAG:-main}
  environment: &env
    DATABASE_URL: postgres://logistics:logistics@postgres:5432/logistics?sslmode=disable
    PUBLIC_URL: http://localhost:${KIFLET_PORT:-8080}
    ENVIRONMENT: development
    AUTO_MIGRATE: "true"
    APP_SECRET: clients-test-secret-0123456789abcdef0123456789
    ALLOW_MOCK_PROVIDERS: "true"
    LOG_LEVEL: warn
    SMS_PROVIDER: ethiotelecom
    ETHIO_TELECOM_API_URL: http://sandbox:8091/ethiotelecom
    ETHIO_TELECOM_API_KEY: clients-ethio-telecom-key
    ETHIO_TELECOM_SENDER_ID: KIFLET
    SMS_NUMBER: "6060"
    SMS_INBOUND_SECRET: clients-sms-webhook-secret
    PAYMENT_PROVIDER: telebirr,cbebirr
    TELEBIRR_API_URL: http://sandbox:8091/telebirr
    TELEBIRR_CHECKOUT_URL: http://localhost:${SANDBOX_PORT:-8091}/telebirr/checkout?
    TELEBIRR_FABRIC_APP_ID: clients-fabric-app
    TELEBIRR_APP_SECRET: clients-telebirr-app-secret
    TELEBIRR_MERCHANT_APP_ID: "1100000000000001"
    TELEBIRR_MERCHANT_CODE: "900001"
    TELEBIRR_PRIVATE_KEY_FILE: /keys/merchant_private.pem
    TELEBIRR_PUBLIC_KEY_FILE: /keys/telebirr_public.pem
    CBEBIRR_MERCHANT_ID: "100100"
    CBEBIRR_CALLBACK_USERNAME: cbebirr
    CBEBIRR_CALLBACK_PASSWORD: clients-cbebirr-password
    SANDBOX_URL: http://localhost:${SANDBOX_PORT:-8091}
  volumes:
    - keys:/keys:ro
    - files:/data/uploads

services:
  postgres:
    image: postgis/postgis:17-3.6-alpine
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The sandbox's throwaway telebirr keys, for it and the app.
  keys:
    image: ${KIFLET_SANDBOX_IMAGE:-ghcr.io/kiflet/sandbox}:${KIFLET_TAG:-main}
    command: keys
    environment:
      SANDBOX_KEYS_DIR: /keys
    volumes:
      - keys:/keys

  # Migrates and loads the demo company, once.
  seed:
    <<: *backend
    # Once: a restart keeps the data it loaded.
    command: [seed, --if-empty]
    depends_on:
      postgres:
        condition: service_healthy
      keys:
        condition: service_completed_successfully

  app:
    <<: *backend
    command: serve
    ports:
      - "127.0.0.1:${KIFLET_PORT:-8080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully

  sandbox:
    image: ${KIFLET_SANDBOX_IMAGE:-ghcr.io/kiflet/sandbox}:${KIFLET_TAG:-main}
    environment:
      <<: *env
      SANDBOX_ADDR: 0.0.0.0:8091
      SANDBOX_KEYS_DIR: /keys
      SANDBOX_APP_URL: http://app:8080
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-8091}:8091"
    volumes:
      - keys:/keys:ro
    depends_on:
      keys:
        condition: service_completed_successfully

volumes:
  keys:
  files:
