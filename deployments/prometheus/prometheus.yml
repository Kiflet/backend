global:
  scrape_interval: 30s

scrape_configs:
  - job_name: kiflet
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    # Each instance of the app, however many Compose runs. The final dot
    # keeps the host's search domains out of the lookup: one that fails
    # makes Prometheus give up on the name.
    dns_sd_configs:
      - names: ["app."]
        type: A
        port: 8080
        refresh_interval: 30s

  # Garage's own figures, with the garage profile (docs/architecture.md,
  # section 14). Its metrics token is METRICS_TOKEN too. Without the
  # profile the name doesn't resolve and there is nothing to scrape.
  - job_name: garage
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    dns_sd_configs:
      - names: ["garage."]
        type: A
        port: 3903
        refresh_interval: 30s
  # With the rabbitmq profile: queue depths, consumers, publish and
  # delivery rates, from RabbitMQ's own plugin. Reachable only on the
  # compose network.
  - job_name: rabbitmq
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["rabbitmq."]
        type: A
        port: 15692
        refresh_interval: 30s
