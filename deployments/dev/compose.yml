# Development database and RabbitMQ. The app itself runs on the host with
# `make run`. DB_PORT and RABBITMQ_PORT move them off 5434 and 5673 if
# those ports are taken.
#
# The provider sandbox, for an app on the host run with `make run-sandbox`:
#   make sandbox-keys && docker compose -f deployments/dev/compose.yml --profile sandbox up sandbox
#
# The project is named, or it would be named after the directory, and
# compose would take another checkout in a directory of the same name for
# this one.
name: kiflet-dev

services:
  postgres:
    image: postgis/postgis:17-3.6-alpine
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      # PostgreSQL 17's. The volume of 15 (postgres_data) is left as it was;
      # `make seed` fills this one.
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: on first start the image's set-up server answers on the
      # socket only, and the app connects over the network.
      test: ["CMD-SHELL", "pg_isready -U logistics -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # `make run` uses it when it is up (`make db` starts it).
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: kiflet
      RABBITMQ_DEFAULT_PASS: kiflet
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      # The management pages: http://localhost:15673 (kiflet, kiflet).
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  sandbox:
    profiles: [sandbox]
    build:
      context: ../..
      target: sandbox
    env_file: sandbox.env
    environment:
      SANDBOX_ADDR: 0.0.0.0:8091
      SANDBOX_KEYS_DIR: /keys
      SANDBOX_APP_URL: http://localhost:${PORT:-8080}
      # The app is on the host, which localhost isn't from in here.
      SANDBOX_HOST_ALIAS: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ../../sandbox-keys:/keys:ro

volumes:
  postgres17_data:
  rabbitmq_data:
