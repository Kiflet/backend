    SyncResult:
      description: What became of one item sent. ok and refused items leave the
        phone's queue; retry ones stay for the next sync.
      type: object
      required:
      - client_id
      - kind
      - ok
      properties:
        client_id:
          type: string
        kind:
          type: string
          description: status, pod, location or message
        ok:
          type: boolean
        retry:
          type: boolean
        code:
          type: string
          description: 'Why it was refused, a stable code the app chooses its words
            by (the config''s labels): cancelled (the office cancelled the load),
            reassigned (it is another driver''s now), stale (the office changed
            it after the move was made, and its decision stands), held_for_review
            (the delivery is kept for the office to review; nothing more to send),
            not_found (no such load for this driver), invalid (the item can''t
            be read; the message says why), or server_error (retry is true). Open:
            a code the app doesn''t know is shown by its message.'
        message:
          type: string
    SyncResponse:
