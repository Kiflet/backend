# The contract of /api/v1 (docs/architecture.md, section 11): written by
# hand and reviewed like code. Each operation is tagged with who may call
# it. The routes and this file must match (TestSpecificationMatchesTheAPI),
# and every response the integration tests receive is checked against it.
openapi: 3.1.0
info:
  title: Kiflet API
  version: '1'
  description: 'The one API of Kiflet (docs/architecture.md, section 11), for every
    client: Kiflet/web, Kiflet/mobile and companies'' own systems. Each operation
    is tagged with who may call it: public (an API key, or the session), driver
    (a driver''s token) or app (the session alone, for Kiflet/web). What a tag promises
    is in section 11, "Who may call what". @kiflet/api is generated from this file.
    Every answer has an X-Request-Id, and a 429 a Retry-After in seconds.'
servers:
- url: /api/v1
security:
- apiKey: []
tags:
- name: public
  description: |-
    Book and follow a company's shipments from its own systems. Every request sends one of the company's API keys, made under Settings → API keys: `Authorization: Bearer kf_…`. A key acts for the whole company with the dashboard's rules, and what it does is recorded under the key's name in each shipment's history.

    Each key may make 300 requests a minute; past that, requests are answered 429, with `Retry-After`, until the minute is over. Times are RFC 3339 and answered in UTC. Weights are in kilograms and values in santim.

    A code comes with its words, `{"code": "in_transit", "label": "In transit"}`, in the language `Accept-Language` asks for (English or Amharic; English without it): act on the code, show the label, and show a code you don't know by its label. A shipment's `actions` are the operations it allows now; show what they allow rather than working it out.

    An error is answered with its HTTP status and `{"error": {"code": …, "message": …, "fields": …, "request_id": …}}`. `code` is in lowercase snake case (`validation_error`, `not_found`); `message` is written to be shown to a person; `fields` names every field at fault, each with its message; `request_id` is the answer's `X-Request-Id`, to quote when asking for help.

    Webhooks tell a company's system when its shipments change, without asking: an admin adds an address and the events it wants under Settings → Webhooks. Each is a POST of a `WebhookMessage`, signed as Standard Webhooks (https://www.standardwebhooks.com) describes: `webhook-id` (the same when a message is sent again), `webhook-timestamp` and `webhook-signature`. Answer 2xx within 10 seconds; anything else is tried again after 1 and 5 minutes, 30 minutes, then 2, 6 and 12 hours.
- name: driver
  description: The driver app's operations, under /driver. The app signs in with
    the driver's phone number and PIN, and sends the token it gets with every other
    call.
- name: app
  description: Kiflet/web's operations, called with the session cookie alone. An
    API key calling one gets 403.
paths:
  /shipments:
    get:
      operationId: listShipments
      summary: List shipments, newest first unless sorted otherwise
      parameters:
      - name: status
        in: query
        description: One status, or several separated by commas.
        schema:
          type: string
          examples:
          - in_transit,delayed
      - name: driver_id
        in: query
        schema:
          type: string
          format: uuid
      - name: priority
        in: query
        schema:
          $ref: '#/components/schemas/Priority'
      - name: q
        in: query
        description: Searches the tracking number, the customer's and receiver's
          names and phones, and the driver's name.
        schema:
          type: string
      - name: created_from
        in: query
        schema:
          type: string
          format: date-time
      - name: created_to
        in: query
        schema:
          type: string
          format: date-time
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_desc
          - created_asc
          - updated_desc
          - eta_asc
          - eta_desc
          - status
          - priority
          - customer
          - tracking
          default: created_desc
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: A page of shipments
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - page
                - per_page
                - total
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
                    description: How many shipments match, on every page.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - public
    post:
      operationId: createShipment
      summary: Book a shipment
      description: Checked as the booking form checks it, and the customer is texted
        as from the form. With `driver_id`, the shipment is assigned at once. Without
        `estimated_delivery`, the arrival is estimated from the route.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentBooking'
      responses:
        '201':
          description: Booked. `Location` is the shipment's address in the API.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '402':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - public
  /shipments/{ref}:
    parameters:
    - $ref: '#/components/parameters/Ref'
    get:
      operationId: getShipment
      summary: One shipment
      responses:
        '200':
          description: The shipment
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - public
    patch:
      operationId: updateShipment
      summary: Change a booking
      description: 'A field left out stays as it is. An object that is sent replaces
        the whole of what it names: send a destination''s city and address together.
        `receiver`, `planned_pickup` and `estimated_delivery` can be sent as null
        to remove them; a null `estimated_delivery` goes back to the estimate from
        the route. The driver is changed with `/assign`.'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentChange'
      responses:
        '200':
          description: The shipment as changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/ShipmentVersionMismatch'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - public
  /shipments/{ref}/assign:
    parameters:
    - $ref: '#/components/parameters/Ref'
    post:
      operationId: assignShipment
      summary: Assign a driver, change the driver, or take the driver off
      description: The driver is texted as from the dashboard. Without `vehicle_id`,
        the driver's usual vehicle goes. A null or empty `driver_id` takes the shipment
        back to pending, if it hasn't left.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                driver_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                vehicle_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The shipment as assigned
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '402':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/ShipmentVersionMismatch'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - public
  /shipments/{ref}/cancel:
    parameters:
    - $ref: '#/components/parameters/Ref'
    post:
      operationId: cancelShipment
      summary: Cancel a shipment
      description: Before it leaves, the reasons are customer_request, duplicate,
        address_problem, cargo_unavailable, payment_problem and other. On the road,
        they are recipient_refused, returned_to_origin, cargo_lost_damaged, customer_request,
        address_problem, payment_problem and other.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  enum:
                  - customer_request
                  - duplicate
                  - address_problem
                  - cargo_unavailable
                  - payment_problem
                  - recipient_refused
                  - returned_to_origin
                  - cargo_lost_damaged
                  - other
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: The shipment, cancelled
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/ShipmentVersionMismatch'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - public
  /shipments/{ref}/events:
    parameters:
    - $ref: '#/components/parameters/Ref'
    get:
      operationId: shipmentEvents
      summary: A shipment's history, oldest first, and where its truck was last
        seen
      responses:
        '200':
          description: The history
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - last_position
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  last_position:
                    oneOf:
                    - type: 'null'
                    - type: object
                      required:
                      - lat
                      - lng
                      - recorded_at
                      properties:
                        lat:
                          type: number
                        lng:
                          type: number
                        recorded_at:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - public
  /drivers:
    get:
      operationId: listDrivers
      summary: List the company's drivers
      parameters:
      - name: active
        in: query
        description: false lists deactivated drivers too.
        schema:
          type: boolean
          default: true
      - name: q
        in: query
        description: Searches names and phones.
        schema:
          type: string
      responses:
        '200':
          description: The drivers
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Driver'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      tags:
      - public
  /openapi.json:
    get:
      operationId: getPublicSpecification
      tags:
      - public
      summary: The public operations' specification
      description: This document, as far as the public operations go, in JSON.
      security: []
      responses:
        '200':
          description: The specification
          content:
            application/json:
              schema:
                type: object
        '429':
          $ref: '#/components/responses/Error'
  /driver/config:
    get:
      operationId: getDriverConfig
      tags:
      - driver
      summary: What the app needs to work offline
      description: The status rules, reason lists and their words, fetched as the
        app starts and before sign-in. They are derived from the server's rules,
        so the app never offers a move the server would refuse. Its ETag changes
        with it, and each sync names the current one (config_etag), so the app
        fetches it again, with If-None-Match, only when they differ.
      security: []
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The configuration
          headers:
            ETag:
              description: The configuration's version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverConfig'
        '304':
          description: The configuration is the one If-None-Match names.
          headers:
            ETag:
              description: The configuration's version.
              schema:
                type: string
        '429':
          $ref: '#/components/responses/Error'
  /driver/login:
    post:
      operationId: driverSignIn
      tags:
      - driver
      summary: Sign in with a phone number and PIN
      description: 'One token per device: signing in again on the same device replaces
        its token. Five wrong PINs lock the account for a while.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - pin
              properties:
                phone:
                  type: string
                  description: 'In any common form: 0911…, +251911…'
                pin:
                  type: string
                device_id:
                  type: string
                  description: The app's ID for this phone
      responses:
        '200':
          $ref: '#/components/responses/DriverSignedIn'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /driver/pin-reset/request:
    post:
      operationId: requestDriverPINReset
      tags:
      - driver
      summary: Ask for a code to set a new PIN
      description: Texts a code to the number if it belongs to a driver. The answer
        is the same either way.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: Asked; a code is on its way if the number is a driver's
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - message
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /driver/pin-reset/confirm:
    post:
      operationId: confirmDriverPINReset
      tags:
      - driver
      summary: Set a new PIN with the code, and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - code
              - pin
              properties:
                phone:
                  type: string
                code:
                  type: string
                pin:
                  type: string
                device_id:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/DriverSignedIn'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /driver/logout:
    post:
      operationId: driverSignOut
      tags:
      - driver
      summary: Sign out this device
      security:
      - driverToken: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /driver/pin:
    post:
      operationId: changeDriverPIN
      tags:
      - driver
      summary: Change the PIN
      security:
      - driverToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_pin
              - new_pin
              properties:
                current_pin:
                  type: string
                new_pin:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /driver/sync:
    post:
      operationId: driverSync
      tags:
      - driver
      summary: Send what the phone did, and get what changed
      description: 'One round trip: the statuses, deliveries, positions and messages
        recorded on the phone go up, each with its client_id, and each gets a result;
        a repeat of an item already taken gets the same result again. What changed
        for the driver since the cursor comes back, with the cursor to send next
        time (docs/architecture.md, section 11, "The driver sync"). The body may
        be sent gzip-compressed, with Content-Encoding: gzip.'
      security:
      - driverToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: What became of each item, and what changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
webhooks:
  shipment.created:
    post:
      operationId: shipmentCreated
      summary: A shipment is booked, from the dashboard, a CSV file or the API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookMessage'
      responses:
        2XX:
          description: Received. Anything else is tried again.
  shipment.status_changed:
    post:
      operationId: shipmentStatusChanged
      summary: A shipment's status changes; data.event has from_status and to_status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookMessage'
      responses:
        2XX:
          description: Received. Anything else is tried again.
  shipment.delivered:
    post:
      operationId: shipmentDelivered
      summary: A shipment is delivered; sent as well as its status change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookMessage'
      responses:
        2XX:
          description: Received. Anything else is tried again.
  shipment.issue_reported:
    post:
      operationId: shipmentIssueReported
      summary: The driver reports a problem (as well as the status change), or the
        receiver does on the confirmation page (event type customer_issue)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookMessage'
      responses:
        2XX:
          description: Received. Anything else is tried again.
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A key from Settings → API keys. It starts with kf_.
    driverToken:
      type: http
      scheme: bearer
      description: The token from signing in on the driver app, one per device.
  headers:
    ETag:
      description: 'The record''s version, quoted ("3"). Send it back as If-Match to change the record only if no one has since.'
      schema:
        type: string
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The ETag of the copy the app holds; answered 304 when it is still current.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: 'The ETag of the copy the change was made from. When the record has changed since, the change is refused 412 with the record as it is now.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'A key of the caller''s choosing, one per booking. Sent again within 24 hours with the same request, it gets the first answer without booking again, marked Idempotent-Replayed: true; with another request, 422 idempotency_key_reused; while the first still runs, 409 idempotency_key_in_flight. Only a success is kept.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Ref:
      name: ref
      in: path
      required: true
      description: The shipment's tracking number or its id.
      schema:
        type: string
  responses:
    Error:
      description: 'An error. 400: the request is wrong (validation_error). 401:
        no working key (unauthorized). 402: a plan limit (plan_limit). 403: the
        company is suspended or read-only until an invoice is paid (forbidden).
        404: no such shipment for this company (not_found). 409: the shipment is
        in a status that doesn''t allow it (conflict). 403 tenant_suspended:
        the company is paused (a driver''s app keeps everything and tries later).
        413 too_large: the request is larger than the server takes (send less at
        a time). 429: too many requests (rate_limited). 409 also: the first request with this Idempotency-Key is still running (idempotency_key_in_flight). 412: the shipment changed since the If-Match (version_mismatch). 422: an Idempotency-Key sent again with another request (idempotency_key_reused).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ShipmentVersionMismatch:
      description: 'The shipment has changed since the version in If-Match (version_mismatch). `current` is the shipment as it is now, and the ETag its version.'
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              required:
              - current
              properties:
                current:
                  $ref: '#/components/schemas/Shipment'
    OK:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required:
            - ok
            properties:
              ok:
                type: boolean
    DriverSignedIn:
      description: Signed in
      content:
        application/json:
          schema:
            type: object
            required:
            - token
            - expires_at
            - must_change_pin
            - driver
            properties:
              token:
                type: string
              expires_at:
                type: string
                format: date-time
              must_change_pin:
                type: boolean
                description: The PIN was set by the office and must be changed first.
              driver:
                type: object
                required:
                - id
                - name
                - phone
                - company
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  phone:
                    type: string
                  company:
                    type: string
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Stable, in lowercase snake case: validation_error, unauthorized,
                plan_limit, forbidden, not_found, conflict, rate_limited, internal,
                and more precise ones an operation names. Open: a client treats one
                it doesn''t know by the status.'
              examples:
              - not_found
            message:
              type: string
              description: What went wrong, for the person using the product.
            fields:
              type: object
              description: Every invalid field at once, with its message.
              additionalProperties:
                type: string
            request_id:
              type: string
              description: The request's ID, as in the answer's X-Request-Id, to
                quote when asking for help.
    Priority:
      type: string
      enum:
      - normal
      - high
      - urgent
    Place:
      type: object
      additionalProperties: false
      required:
      - city
      - address
      properties:
        city:
          type: string
          description: A town the service knows, such as Addis Ababa or Adama.
        address:
          type: string
        lat:
          type:
          - number
          - 'null'
          description: Sent with lng to pin the place; otherwise the town's centre.
        lng:
          type:
          - number
          - 'null'
    Party:
      type: object
      additionalProperties: false
      required:
      - name
      - phone
      properties:
        name:
          type: string
        phone:
          type: string
          description: An Ethiopian mobile number, 09… or +251…
    Cargo:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
        weight_kg:
          type: number
          minimum: 0
        value_santim:
          type: integer
          format: int64
          minimum: 0
          description: What the cargo is worth, in santim (100 to the birr); 0 when
            not given.
        pieces:
          type: integer
          minimum: 0
          maximum: 1000000
          description: How many pieces the load is; 0 when not counted.
        unit:
          type: string
          maxLength: 30
          description: What the pieces are, e.g. bales. Only with pieces.
    Shipment:
      type: object
      required:
      - id
      - tracking_number
      - status
      - priority
      - origin
      - destination
      - customer
      - receiver
      - cargo
      - tracking_url
      - actions
      - version
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
