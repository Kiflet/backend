    CodeLabel:
      description: A code and its words.
      type: object
      required:
      - code
      - label
      properties:
        code:
          type: string
        label:
          type: string
    DriverConfig:
      type: object
      required:
      - app_name
      - version
      - sms_number
      - statuses
      - transitions
      - moves
      - pod_from
      - delay_reasons
      - issue_reasons
      - location_reasons
      - labels
      - max_photos
      - tile_url
      - tile_credit
      - gps
      - photo_max_px
      - photo_quality
      - sync_interval_s
      - sync_interval_saving_s
      - sms_commands
      - sms_fallback_after_s
      properties:
        app_name:
          type: string
        version:
          type: string
          description: The server's version
        sms_number:
          type: string
          description: Where a driver without data sends status texts
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/CodeLabel'
        transitions:
          description: For each status, those a driver may move a load to from it,
            the next step first.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        moves:
          description: 'For each status, the driver''s buttons, the main one first:
            the status each leads to (delivered: recording the delivery), and
            the code of its words in labels.move ("Start trip" and "Back on the
            road" both lead to in_transit).'
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/DriverMove'
        pod_from:
          description: The statuses a delivery may be recorded from.
          type: array
          items:
            type: string
        delay_reasons:
          type: array
          items:
            $ref: '#/components/schemas/CodeLabel'
        issue_reasons:
          type: array
          items:
            $ref: '#/components/schemas/CodeLabel'
        location_reasons:
          description: Asked for when a delivery is recorded away from the destination.
          type: array
          items:
            $ref: '#/components/schemas/CodeLabel'
        labels:
          description: 'The driver''s words for every code, by language (en, am),
            kind (status, reason, priority, move, refusal, removal, held) and code,
            so a code added on the server reads right on a phone not yet updated.
            The other lists'' labels are in English.'
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: string
        max_photos:
          type: integer
        tile_url:
          type: string
        tile_credit:
          type: string
        gps:
          $ref: '#/components/schemas/DriverGPS'
        photo_max_px:
          type: integer
          description: A photo is resized to this on its long side.
        photo_quality:
          type: number
          description: Its JPEG quality, from 0 to 1.
        sync_interval_s:
          type: integer
          description: How often the app syncs while on screen, in seconds.
        sync_interval_saving_s:
          type: integer
          description: How often in battery saver.
        sms_commands:
          description: 'For each status a driver may report by SMS, the text
            to send to sms_number, {ref} standing for the load''s ref: "ET {ref}
            3" for arrived.'
          type: object
          additionalProperties:
            type: string
        sms_fallback_after_s:
          type: integer
          description: How long a move may wait for data, in seconds, before
            the app offers to send it by SMS.
        map_styles:
          description: The map's MapLibre styles, Desk (light) and Night (dark).
            Absent until the platform serves its tiles; the app then shows
            distance and direction only.
          type: object
          required:
          - light
          - dark
          properties:
            light:
              type: string
            dark:
              type: string
    DriverGPS:
      type: object
      description: How the app records a trip, in metres and seconds.
      required:
      - moved_m
      - interval_s
      - max_interval_s
      - parked_after_s
      - parked_check_s
      - parked_left_m
      - max_accuracy_m
      - saving_below_battery
      - saving_interval_s
      - saving_parked_check_s
      - saving_max_accuracy_m
      properties:
        moved_m:
          type: integer
          description: Moving means more than this from the last position.
        interval_s:
          type: integer
          description: While moving, at most one position this often.
        max_interval_s:
          type: integer
          description: While moving, at least one this often.
        parked_after_s:
          type: integer
          description: Within moved_m this long is parked; the GPS is off.
        parked_check_s:
          type: integer
          description: Parked, a balanced fix this often.
        parked_left_m:
          type: integer
          description: Parked, a fix this far away is moving again.
        max_accuracy_m:
          type: integer
          description: Fixes vaguer than this are dropped.
        saving_below_battery:
          type: number
          description: Battery saver starts below this charge (0 to 1) when
            not charging, or when the driver chooses it.
        saving_interval_s:
          type: integer
          description: In battery saver, one position this often.
        saving_parked_check_s:
          type: integer
          description: In battery saver, parked checks this often.
        saving_max_accuracy_m:
          type: integer
          description: In battery saver, fixes up to this vague are kept.
    DriverMove:
      type: object
      required:
