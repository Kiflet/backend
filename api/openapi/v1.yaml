        type:
          type: string
          description: created, edited, assigned, unassigned, status_changed, note,
            message, pod_recorded, pod_held, pod_accepted, pod_dismissed, customer_confirmed,
            customer_issue and others.
        from_status:
          anyOf:
          - $ref: '#/components/schemas/Code'
          - type: 'null'
        to_status:
          anyOf:
          - $ref: '#/components/schemas/Code'
          - type: 'null'
        reason:
          anyOf:
          - $ref: '#/components/schemas/Code'
          - type: 'null'
        note:
          type: string
        source:
          type: string
          enum:
          - dashboard
          - app
          - sms
          - system
          - customer
          - api
        actor:
          type: string
          description: 'Who did it: a person, "System", or "API: " and a key''s
            name.'
        lat:
          type:
          - number
          - 'null'
        lng:
          type:
          - number
          - 'null'
        at:
          type: string
          format: date-time
    WebhookMessage:
      type: object
      required:
      - type
      - timestamp
      - data
      properties:
        type:
          type: string
          enum:
          - shipment.created
          - shipment.status_changed
          - shipment.delivered
          - shipment.issue_reported
          - test
        timestamp:
          type: string
          format: date-time
          description: When it happened.
        data:
          type: object
          description: The shipment just after the change, and what happened. A
            test carries a message instead.
          properties:
            shipment:
              $ref: '#/components/schemas/Shipment'
            event:
              $ref: '#/components/schemas/Event'
    Driver:
      type: object
      required:
