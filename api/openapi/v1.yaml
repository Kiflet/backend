          - $ref: '#/components/schemas/Party'
        cargo:
          $ref: '#/components/schemas/Cargo'
        instructions:
          type: string
        driver_id:
          type:
          - string
          - 'null'
          format: uuid
        vehicle_id:
          type:
          - string
          - 'null'
          format: uuid
        planned_pickup:
          type:
          - string
          - 'null'
          format: date-time
        estimated_delivery:
          type:
          - string
          - 'null'
          format: date-time
        picked_up_at:
          type:
          - string
          - 'null'
          format: date-time
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
        receipt_confirmed:
          type: boolean
