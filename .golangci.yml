# golangci-lint, run in CI and by `make lint`. go vet runs on its own
# (`make vet`), so it isn't repeated here.
version: "2"

run:
  # The integration and end-to-end tests are code too.
  build-tags: [integration, e2e]

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      # Letting go of something that was only read, or of a connection: if
      # that fails there is nothing to do and no one to tell. A file or a
      # stream that was written is still checked, since closing it can be
      # where the write fails.
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*net/smtp.Client).Close
        - (*compress/gzip.Reader).Close
        - (*database/sql.DB).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*github.com/gorilla/websocket.Conn).Close
    staticcheck:
      checks:
        - all
        # golangci-lint's own defaults leave these out: a comment on every
        # package and exported name, initialisms in names, and receiver
        # names. This code doesn't follow them.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # De Morgan's law: !(a || b) often says what is meant better than
        # its expansion.
        - -QF1001
    gosec:
      excludes:
        # Unchecked errors: errcheck checks them, with the exceptions above.
        - G104
        # Integer conversions: the values converted (limits, counts, page
        # numbers, sizes) are bounded where they come in, which the rule
        # can't see, so it flags every int32 a query takes.
        - G115
  exclusions:
    rules:
      # Tests run commands, read the files they are given and draw random
      # data on purpose.
      - path: (_test\.go$|^tests/)
        linters: [gosec]
        text: "G(204|304|404|703)"
      # The server-rendered pages, frozen until Kiflet/web replaces them:
      # every redirect goes to a path built here or checked by localPath
      # and safeNext, each cookie's Secure comes from
      # config.SecureCookies(), and assets come from an embedded FS. The
      # rules can't follow that; new HTTP code is checked in full.
      - path: ^internal/web/
        linters: [gosec]
        text: "G(124|602|703|710)"

issues:
  # Everything, every time: there is no backlog of excused findings.
  max-issues-per-linter: 0
  max-same-issues: 0
