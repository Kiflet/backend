# oapi-codegen's settings for the API's Go types and server interface,
# generated from api/openapi/v1.yaml by make api. CI regenerates them and
# fails on a difference.
package: api
output: internal/platform/api/api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
output-options:
  # Keep the schemas only the webhooks use, such as WebhookMessage.
  skip-prune: true
  # A number without a format is any JSON number: float64, not float32.
  type-mapping:
    number:
      default:
        type: float64
